name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "bench/results.md"
      - "docs/book-validation.md"
      - "docs/sweep-detection.md"
      - "scripts/audit-web-output.mjs"
      - "scripts/generate-public-report-data.mjs"
      - "scripts/validate-public-report-data.mjs"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install web dependencies
        run: npm install --prefix web --no-package-lock

      - name: Verify public evidence
        run: |
          node scripts/validate-public-report-data.mjs

      - name: Verify static application
        run: npm --prefix web run verify

      - name: Install browser test runtimes
        working-directory: web
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser and accessibility matrix
        run: npm --prefix web run test:e2e

      - name: Build repository Pages path
        run: npm --prefix web run build -- --base "/${{ github.event.repository.name }}/"

      - name: Audit Pages artifact
        run: node scripts/audit-web-output.mjs web/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
