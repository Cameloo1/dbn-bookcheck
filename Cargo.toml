[workspace]
members = [
    "crates/dbn-es-core",
    "crates/dbn-es-bench",
    "crates/dbn-es-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Cameloo1/dbn-bookcheck"

[workspace.dependencies]
clap = { version = "4.5.51", features = ["derive"] }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
databento = { version = "0.56.0", default-features = false, features = ["historical"] }
dbn = { version = "0.64.0", features = ["serde"] }
fallible-streaming-iterator = "0.1.9"
napi = { version = "=2.16.17", default-features = false, features = ["napi6"] }
napi-derive = "=2.16.13"
proptest = "1.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "=0.3.54", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
zstd = "0.13"

[workspace.dependencies.napi-build]
version = "=2.2.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
